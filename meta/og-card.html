<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#090909;color:#f2f2f2;font-family:Inter,sans-serif;position:relative;overflow:hidden}
.glow{position:absolute;inset:0;background:radial-gradient(55% 70% at 78% 40%,rgba(242,125,179,.28),transparent 70%),radial-gradient(40% 50% at 10% 100%,rgba(242,125,179,.10),transparent 70%)}
.grid{position:absolute;inset:0;opacity:.45;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(70% 90% at 75% 40%,#000,transparent 80%);-webkit-mask-image:radial-gradient(70% 90% at 75% 40%,#000,transparent 80%)}
.left{position:absolute;left:84px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:680px}
.pill{align-self:flex-start;display:flex;gap:10px;align-items:center;font-size:20px;font-weight:500;color:#8a8a8a;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);padding:9px 18px;border-radius:999px}
.pill i{width:9px;height:9px;border-radius:50%;background:#f27db3;box-shadow:0 0 14px #f27db3}
h1{font-size:96px;line-height:1;letter-spacing:-.04em;font-weight:700;margin:30px 0 22px}
h1 em{font-style:normal;color:#f27db3}
p{font-size:30px;line-height:1.35;color:#8a8a8a;font-weight:500;max-width:600px}
.os{display:flex;gap:12px;margin-top:34px}
.os span{font-size:22px;font-weight:600;color:#f27db3;background:rgba(242,125,179,.14);border:1px solid rgba(242,125,179,.4);padding:10px 22px;border-radius:999px}
.tile{position:absolute;right:96px;top:115px;width:400px;height:400px;border-radius:92px;background:linear-gradient(180deg,#211f26,#0a0a0d);border:1px solid rgba(255,255,255,.1);box-shadow:0 40px 120px -20px rgba(242,125,179,.45),0 0 0 1px rgba(0,0,0,.6);display:grid;place-items:center;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 48%,rgba(242,125,179,.28),transparent 62%)}
.tile svg{width:232px;height:232px;fill:#f27db3;position:relative;filter:drop-shadow(0 8px 30px rgba(242,125,179,.5))}
</style></head><body>
<div class="glow"></div><div class="grid"></div>
<div class="left">
  <div class="pill"><i></i>For your Haunt Image Host</div>
  <h1>Poltergeist</h1>
  <p>Capture it. <b style="color:#f27db3;font-weight:600">Upload it.</b> The link’s already copied.</p>
  <div class="os"><span>Windows</span><span>macOS</span></div>
</div>
<div class="tile"><svg viewBox="0 0 18 18"><path fill-rule="evenodd" d="M3,15 L3,9 C3,1 15,1 15,9 L15,15 C14.4,17.7 11.6,17.7 11,15 C10.4,17.7 7.6,17.7 7,15 C6.4,17.7 3.6,17.7 3,15 Z M5.6,7.9 A1.2,1.5 0 1 0 8,7.9 A1.2,1.5 0 1 0 5.6,7.9 Z M10,7.9 A1.2,1.5 0 1 0 12.4,7.9 A1.2,1.5 0 1 0 10,7.9 Z"/></svg></div>
</body></html>
